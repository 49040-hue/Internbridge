<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — InternBridge</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>body{display:flex;align-items:center;justify-content:center;height:100vh;background:#f8fafc} .card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 6px 20px rgba(15,23,42,0.06);width:360px}</style>
</head>
<body>
  <div class="card">
    <h2 style="margin-bottom:6px">Reset Password</h2>
    <p style="color:#6b7280;font-size:13px;margin-bottom:12px">Enter a new password for your account.</p>
    <div style="margin-bottom:10px"><label>New Password</label><input id="rp-pass" type="password" placeholder="Min 6 characters" style="width:100%;padding:8px;margin-top:6px"/></div>
    <div style="margin-bottom:10px"><label>Confirm Password</label><input id="rp-pass2" type="password" placeholder="Confirm password" style="width:100%;padding:8px;margin-top:6px"/></div>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button onclick="doReset()" class="btn btn-primary">Reset Password</button></div>
    <div id="rp-msg" style="margin-top:12px;font-size:13px;color:#6b7280"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function qs(name){ const u = new URL(location.href); return u.searchParams.get(name); }
    async function doReset(){
      const p=document.getElementById('rp-pass').value; const p2=document.getElementById('rp-pass2').value; const token=qs('token');
      const msg=document.getElementById('rp-msg'); msg.textContent='';
      if(!token) { msg.textContent='Missing token in URL.'; return; }
      if(!p||p.length<6){ msg.textContent='Password must be at least 6 characters.'; return; }
      if(p!==p2){ msg.textContent='Passwords do not match.'; return; }
      try{
        const res = await api.resetPassword(token,p);
        msg.style.color='green'; msg.textContent = res.message || 'Password reset successful. You can now sign in.';
      }catch(e){ msg.style.color='red'; msg.textContent = e.message || 'Failed to reset password.'; }
    }
  </script>
</body>
</html>
